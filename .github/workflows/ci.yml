name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio-ci
          POSTGRES_DB: studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Base dédiée aux tests (nom en _test, créée et migrée par la suite de tests).
      TEST_DATABASE_URL: postgresql://studio:studio-ci@localhost:5432/studio_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Parcours de bout en bout (Docker)
    runs-on: ubuntu-24.04
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: corepack enable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Fichier .env de CI (valeurs aléatoires, jetées après le job)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_EMAIL=admin@studio.local"
            echo "ADMIN_INITIAL_PASSWORD=$(openssl rand -hex 12)"
            echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > .env
      - run: docker compose up --build -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 200
