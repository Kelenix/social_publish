# Lancement : docker compose up --build
# Tous les ports publiés sont liés à 127.0.0.1 (jamais exposés sur le réseau).
name: studio-publication

x-app-env: &app-env
  DATABASE_URL: postgresql://studio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/studio
  APP_URL: ${APP_URL:-http://localhost:3000}
  MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
  MEDIA_LOCAL_DIR: /data/media
  MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-4294967296}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Exécution des jobs uniquement : la source de vérité reste PostgreSQL.
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applique les migrations puis crée l'administrateur s'il n'existe pas, et s'arrête.
  migrate:
    build: { context: ., target: tools }
    environment:
      <<: *app-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    command: ["sh", "-c", "pnpm db:deploy && pnpm admin:bootstrap"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - media:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    init: true
    environment:
      <<: *app-env
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    volumes:
      - media:/data/media
    # Laisse le temps aux envois en cours de se terminer à l'arrêt.
    stop_grace_period: 60s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  media:
